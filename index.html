<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEVENCHI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEVENCHI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080D1C">
<style>
:root{--bg:#080D1C;--bg2:#111A35;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#fff;--mu:#9aa6c7;--ac:#7554F7;--sh:0 8px 30px rgba(0,0,0,.35)}
[data-t=light]{--bg:#F4F5FB;--bg2:#E8EAF6;--card:rgba(255,255,255,.85);--bd:rgba(40,40,90,.1);--tx:#141a33;--mu:#5d6788;--sh:0 6px 20px rgba(60,60,120,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 0}
#app{max-width:560px;margin:auto;padding:16px 16px 120px}
h1{font-size:1.6rem;margin:6px 0 2px}h2{font-size:1.05rem;margin:18px 0 8px}
small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:12px}
.grad{background:linear-gradient(135deg,#3478F6,var(--ac));color:#fff}
.clock{font-size:2.6rem;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:18px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c);transition:.25s}
.it .bd{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;padding:4px 0}
.it.dn .bd b{text-decoration:line-through;opacity:.55}.it.dn{opacity:.8}
.it.od{box-shadow:0 0 0 1px #f43f5e55}
.ck{width:34px;height:34px;min-width:34px;border-radius:50%;border:2.5px solid var(--c);background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;transition:.2s}
.ck svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:.3s}
.ck.on{background:var(--c)}.ck.on svg{stroke-dashoffset:0}.ck.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.3)}}
.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--c);color:#fff;white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:0;border-radius:14px;padding:11px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;transition:.15s}.btn:active{transform:scale(.95)}
.btn.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.r{background:#f43f5e}
.sm{padding:6px 10px;font-size:.8rem;border-radius:10px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0 10px}
label{font-size:.78rem;color:var(--mu)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tabs button{flex:1;min-width:52px;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 4px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92%,480px);display:flex;justify-content:space-around;padding:8px;border-radius:26px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--sh);z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.65rem;color:var(--mu);padding:6px 10px;border-radius:16px;cursor:pointer}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:var(--ac);box-shadow:0 0 18px var(--ac)}
.view{animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.ring{position:relative;width:130px;height:130px}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;font-weight:700}
.bar{height:9px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3478F6,var(--ac),#A78BFA);transition:width .6s}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
#mod.on{display:flex}#mod .card{width:100%;max-width:560px;margin:auto;max-height:92vh;overflow:auto;background:var(--bg2);border-radius:26px 26px 0 0;margin-bottom:0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-90px);background:var(--ac);color:#fff;padding:12px 18px;border-radius:16px;z-index:30;transition:.4s;max-width:90%;text-align:center}
#toast.on{transform:translateX(-50%)}
.cf{position:fixed;top:-10px;font-size:1.4rem;z-index:40;animation:fall 2.4s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:.8rem}.chip.on{background:var(--ac);color:#fff}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:.7rem}.bars i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--ac),#3478F6);min-height:3px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
input[type=color]{padding:0;height:40px}input[type=checkbox]{width:auto}
body{background:none!important}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--bg2))}
#bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.42;animation:fl 18s ease-in-out infinite alternate}
[data-t=light] #bg i{opacity:.25}
#bg i:nth-child(1){background:#7554F7;top:-25vmax;left:-20vmax}
#bg i:nth-child(2){background:#3478F6;bottom:-28vmax;right:-22vmax;animation-delay:-6s;animation-duration:22s}
#bg i:nth-child(3){background:#A78BFA;top:35%;left:40%;width:30vmax;height:30vmax;opacity:.18;animation-delay:-11s}
@keyframes fl{to{transform:translate(12vmax,8vmax) scale(1.2)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
#sp{position:fixed;inset:0;z-index:99;background:#000;display:grid;place-items:center;transition:opacity .6s,visibility .6s}#sp.out{opacity:0;visibility:hidden}
#sp>div{text-align:center;color:#fff}#sp img{width:112px;height:112px;border-radius:26px;box-shadow:0 0 70px #7554F799;animation:spi 1.1s cubic-bezier(.2,1.4,.4,1) both}
#sp b{display:block;margin-top:20px;letter-spacing:.45em;animation:up .8s .3s both}#sp small{display:block;margin-top:6px;animation:up .8s .5s both}
@keyframes spi{from{transform:scale(.4) rotate(-25deg);opacity:0}}
h1{background:linear-gradient(90deg,var(--tx),#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border-top-color:rgba(255,255,255,.2);transition:transform .25s}
.ent .it{animation:up .5s .15s both}
.ent .view>*{animation:up .6s .36s cubic-bezier(.2,.8,.2,1) both}
.ent .view>:nth-child(1){animation-delay:0s}.ent .view>:nth-child(2){animation-delay:.06s}.ent .view>:nth-child(3){animation-delay:.12s}.ent .view>:nth-child(4){animation-delay:.18s}.ent .view>:nth-child(5){animation-delay:.24s}.ent .view>:nth-child(6){animation-delay:.3s}
.grad{background:linear-gradient(120deg,#3478F6,#7554F7,#A78BFA,#3478F6)!important;background-size:300% 300%;animation:gs 10s ease infinite;position:relative;overflow:hidden}
.grad::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:sh 5s 1s infinite;pointer-events:none}
@keyframes gs{50%{background-position:100% 50%}}@keyframes sh{to{left:140%}}
.ring{filter:drop-shadow(0 0 10px rgba(167,139,250,.55))}
.grad .ring circle:first-child{stroke:rgba(255,255,255,.25)}.grad .ring circle:nth-child(2){stroke:#fff}
.ent .ring circle:nth-child(2){animation:dash 1.4s cubic-bezier(.3,.7,.2,1) both}@keyframes dash{from{stroke-dashoffset:339.3}}
.bar i{position:relative}.ent .bar i{animation:grow 1.1s cubic-bezier(.3,.7,.2,1) both}@keyframes grow{from{width:0}}
.bars i{transform-origin:bottom}.ent .bars i{animation:sy .9s cubic-bezier(.3,.7,.2,1) both}@keyframes sy{from{transform:scaleY(0)}}
.ck{position:relative}.ck.on{box-shadow:0 0 16px var(--c)}
.ck.pop::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);animation:rp .6s ease-out forwards}@keyframes rp{to{transform:scale(2.3);opacity:0}}
.it.dn{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),var(--card))}.it:active{transform:scale(.98)}
nav button{transition:.35s cubic-bezier(.3,1.5,.5,1)}nav button.on{transform:translateY(-5px) scale(1.06)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-right:6px;animation:pl 1.6s infinite}@keyframes pl{to{box-shadow:0 0 0 10px transparent}}.dot{box-shadow:0 0 0 0 #34d399aa}
.logo{width:46px;height:46px;border-radius:13px;box-shadow:0 0 22px #7554F788}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style></head><body data-t="dark">
<div id="bg"><i></i><i></i><i></i></div><div id="sp"><div><img src="icons/icon-192.png" alt=""><b>NEVENCHI</b><small>PLAN. STUDY. GROW. ACHIEVE.</small></div></div><div id="app"></div><div id="mod"></div><div id="toast"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CATS={run:['Run','#F97316'],meal:['Meals','#10B981'],gym:['Gym','#F43F5E'],study:['Study','#8B5CF6'],class:['Classes','#F59E0B'],free:['Free time','#38BDF8'],sleep:['Sleep','#94A3B8']};
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const mm=t=>{const[a,b]=t.split(':');return a*60+ +b},esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const R='Morning Run|05:30|06:10|run',CD='Cool Down / Shower|06:10|07:00|free',BF='Breakfast|07:00|08:00|meal',LU='Lunch|12:00|13:00|meal',SW='Study / Light Work|21:00|21:30|study',PB='Prepare for Bed|21:30|22:00|sleep',SL='Sleep|22:00|05:30|sleep';
const SEED={1:[R,'Get Ready / Free|06:10|12:00|free',LU,'Rest / Prepare for Gym|13:00|14:00|free','Gym|14:00|15:30|gym','Shower / Break|15:30|16:00|free','Library & Study|16:00|16:30|study','Dinner|17:30|18:30|meal','Free Time / Personal Stuff|18:30|21:00|free',SW,PB,SL],
2:[R,CD,BF,'Entrepreneurship|10:00|11:50|class',LU,'E-Tech|13:00|15:50|class','Gym|16:50|18:00|gym','Shower / Break|18:00|18:30|free','Dinner|18:30|19:30|meal','Library & Study|19:30|20:30|study',SW,PB,SL],
3:[R,CD,BF,'Moral Class|08:00|08:50|class','Economics|10:00|10:50|class','Entrepreneurship|11:00|11:50|class',LU,'Economics|15:00|16:50|class','Gym|17:00|18:30|gym','Shower / Break|18:30|19:00|free','Library & Study|19:00|20:30|study','Dinner|20:30|21:00|meal',SW,PB,SL],
4:[R,CD,BF,'Global|08:00|08:50|class','Global|09:00|09:50|class','Anthro|10:00|10:50|class','Anthro|11:00|11:50|class',LU,'CELS|13:30|16:00|class','Gym|16:40|18:30|gym','Shower / Break|18:30|19:00|free','Library & Study|19:00|20:30|study','Dinner|20:30|21:00|meal',SW,PB,SL],
5:[R,CD,BF,'Gym|08:00|09:30|gym','Free Time / Shower|09:30|10:30|free','Study / Library|10:30|12:00|study',LU,'Free Time / Personal Stuff|13:00|17:00|free','Dinner|17:00|18:00|meal','Study / Library|18:00|20:00|study','Free Time / Relax|20:00|21:30|free',PB,'Sleep / Rest|22:00|05:30|sleep']};
const seed=()=>{let n=0,acts=[];for(const d in SEED)SEED[d].forEach(x=>{const[a,s,e,c]=x.split('|');acts.push({id:'a'+(++n),day:+d,name:a,s:mm(s),e:mm(e),cat:c,note:'',desc:'',prio:'normal'})});return{acts,n,done:{},started:{},set:{name:'Nevenchi',theme:'dark',accent:'#7554F7',h24:false,ws:1,fs:16,goal:70,colors:{},remind:true}}};
let S,V='home',SD=new Date().getDay(),Q='',F='all',LT='',pom={m:25,run:false,t:1500,brk:false};
let db;const idb=()=>new Promise(r=>{const q=indexedDB.open('nevenchi',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()});
const dget=()=>new Promise(r=>{if(!db)return r(JSON.parse(localStorage.nv||'null'));const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
const save=()=>{try{localStorage.nv=JSON.stringify(S)}catch(e){}if(db)db.transaction('kv','readwrite').objectStore('kv').put(S,'s')};
const col=c=>S.set.colors[c]||CATS[c][1];
const fmt=m=>{m=(m+1440)%1440;let h=Math.floor(m/60),n=String(m%60).padStart(2,'0');if(S.set.h24)return String(h).padStart(2,'0')+':'+n;const p=h>=12?'PM':'AM';h=h%12||12;return h+':'+n+' '+p};
const tv=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=a=>(a.e-a.s+1440)%1440||1440;
const wk=()=>{const t=new Date();t.setHours(0,0,0,0);const o=(t.getDay()-S.set.ws+7)%7;t.setDate(t.getDate()-o);return t};
const dateOf=day=>{const t=wk();t.setDate(t.getDate()+((day-S.set.ws+7)%7));return K(t)};
const order=()=>[0,1,2,3,4,5,6].map(i=>(i+S.set.ws)%7);
const dayActs=d=>S.acts.filter(a=>a.day===d).sort((a,b)=>a.s-b.s);
const isDone=(id,dt)=>!!(S.done[dt]&&S.done[dt][id]);
const pct=(d,dt)=>{const l=dayActs(d);return l.length?Math.round(100*l.filter(a=>isDone(a.id,dt)).length/l.length):0};
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const over=a=>a.cat!=='sleep'&&S.acts.some(b=>b.id!==a.id&&b.day===a.day&&b.cat!=='sleep'&&a.s<b.e&&b.s<a.e);
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),3200)};
const confetti=()=>{for(let i=0;i<26;i++){const e=document.createElement('div');e.className='cf';e.textContent=['🎉','✨','💜','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}};
function theme(){const t=S.set.theme,l=t==='light'||(t==='system'&&matchMedia('(prefers-color-scheme: light)').matches);document.body.dataset.t=l?'light':'dark';document.documentElement.style.setProperty('--ac',S.set.accent);document.documentElement.style.fontSize=S.set.fs+'px';document.querySelector('meta[name=theme-color]').content=l?'#F4F5FB':'#080D1C'}
function item(a,dt,today){const d=isDone(a.id,dt),c=col(a.cat),od=today&&!d&&a.cat!=='sleep'&&a.s<a.e&&a.e<nowM();
return`<div class="it ${d?'dn':''} ${od?'od':''}" style="--c:${c}"><button class="ck ${d?'on':''} ${LT===a.id+dt?'pop':''}" data-a="tg" data-id="${a.id}" data-d="${dt}" aria-label="Complete ${esc(a.name)}">${CHK}</button><div class="bd" data-a="ed" data-id="${a.id}"><b>${esc(a.name)}</b><small>${fmt(a.s)} – ${fmt(a.e)} · ${CATS[a.cat][0]}${a.prio==='high'?' · ⚑ High':''}${a.note?' · 📝':''}${over(a)?' · ⚠ overlap':''}${od?' · overdue':''}</small></div>${od?`<button class="btn sm g" data-a="rs" data-id="${a.id}">Reschedule</button>`:''}</div>`}
const ring=p=>`<div class="ring"><svg width="130" height="130"><circle cx="65" cy="65" r="54" stroke="var(--bd)"/><circle cx="65" cy="65" r="54" stroke="url(#g)" stroke-dasharray="339.3" stroke-dashoffset="${339.3*(1-p/100)}" style="transition:stroke-dashoffset .8s"/><defs><linearGradient id="g"><stop offset="0" stop-color="#3478F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs></svg><div class="t"><span data-n="${p}">${p}</span>%</div></div>`;
const MSG=['Make today count.','Small steps, big results.','Discipline beats motivation.','Plan. Study. Grow. Achieve.'];
function home(){const n=new Date(),h=n.getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',td=n.getDay(),dt=K(n),l=dayActs(td),p=pct(td,dt),nm=nowM();
const dn=l.filter(a=>isDone(a.id,dt)).length,cur=l.find(a=>a.s<a.e?(a.s<=nm&&nm<a.e):(nm>=a.s||nm<a.e)),nx=l.find(a=>a.s>nm&&a.id!==(cur&&cur.id));
const st=S.started[dt]||{};
return`<div class="view"><small>${n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</small><div class="row"><img class="logo" src="icons/icon-192.png" alt=""><h1 style="margin:0">${g}, ${esc(S.set.name)}.</h1></div><small>Welcome back, ${esc(S.set.name)}. ${MSG[n.getDate()%4]}</small>
<div class="card grad" style="margin-top:14px"><div class="row sp"><div><div class="clock" id="clk"></div><div style="opacity:.85">${dn} done · ${l.length-dn} left</div></div>${ring(p)}</div><div class="bar" style="margin-top:12px;background:rgba(255,255,255,.25)"><i style="width:${p}%;background:#fff"></i></div></div>
${cur?`<div class="card"><small><i class="dot"></i>NOW</small><div class="row sp"><b style="font-size:1.15rem">${esc(cur.name)}</b><span class="tag" style="--c:${col(cur.cat)}">${CATS[cur.cat][0]}</span></div><small>${fmt(cur.s)} – ${fmt(cur.e)}${st[cur.id]?' · started '+fmt(st[cur.id]):''}</small><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,Math.round(100*((nm-cur.s+1440)%1440)/dur(cur)))}%"></i></div><div class="row" style="margin-top:10px"><button class="btn sm" data-a="st" data-id="${cur.id}">▶ Start</button><button class="btn sm g" data-a="tg" data-id="${cur.id}" data-d="${dt}">${isDone(cur.id,dt)?'↺ Undo':'✓ Finish'}</button></div></div>`:''}
${nx?`<div class="card"><small>UP NEXT · in <span id="cd" data-t="${nx.s}"></span></small><div class="row sp"><b>${esc(nx.name)}</b><small>${fmt(nx.s)}</small></div></div>`:''}
<div class="card"><b>🍅 Focus timer</b><div class="clock" id="pt" style="font-size:2.2rem">${pomT()}</div><small>${pom.brk?'Break':'Focus'}</small><div class="row" style="margin-top:8px"><button class="btn sm" data-a="pp">${pom.run?'Pause':'Start'}</button><button class="btn sm g" data-a="pr">Reset</button></div></div>
<h2>Today's schedule</h2>${l.length?l.map(a=>item(a,dt,1)).join(''):'<div class="card mu">Nothing planned. Add activities in Schedule.</div>'}</div>`}
const pomT=()=>String(Math.floor(pom.t/60)).padStart(2,'0')+':'+String(pom.t%60).padStart(2,'0');
function sched(){const d=SD,dt=dateOf(d),l=dayActs(d);
return`<div class="view"><h1>Schedule</h1><div class="tabs">${order().map(x=>`<button class="${x===d?'on':''}" data-a="sd" data-id="${x}">${DN[x].slice(0,3)}</button>`).join('')}</div><div class="row sp"><h2 style="margin:0">${DN[d]} · ${pct(d,dt)}%</h2><button class="btn sm" data-a="add">+ Add</button></div><div style="margin-top:10px">${l.length?l.map(a=>item(a,dt,dt===K(new Date()))).join(''):'<div class="card mu">Empty day. Tap + Add or copy a day in Settings.</div>'}</div></div>`}
function tasks(){const dt=K(new Date()),td=new Date().getDay();let l=S.acts.filter(a=>(F==='all'||a.cat===F)&&a.name.toLowerCase().includes(Q.toLowerCase()));
return`<div class="view"><h1>Tasks</h1><input id="q" placeholder="Search activities…" value="${esc(Q)}"><div class="chips"><span class="chip ${F==='all'?'on':''}" data-a="fl" data-id="all">All</span>${Object.keys(CATS).map(c=>`<span class="chip ${F===c?'on':''}" data-a="fl" data-id="${c}">${CATS[c][0]}</span>`).join('')}</div>
${order().map(d=>{const x=l.filter(a=>a.day===d).sort((a,b)=>a.s-b.s);return x.length?`<h2>${DN[d]}</h2>`+x.map(a=>item(a,dateOf(d),d===td)).join(''):''}).join('')}</div>`}
function stats(){const t=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);days.push(d)}
const P=days.map(d=>pct(d.getDay(),K(d))),avg=Math.round(P.reduce((a,b)=>a+b,0)/7);let m=0;for(let i=0;i<28;i++){const d=new Date(t);d.setDate(t.getDate()-i);m+=pct(d.getDay(),K(d))}m=Math.round(m/28);
let sk=0;for(let i=0;i<365;i++){const d=new Date(t);d.setDate(t.getDate()-i);const p=pct(d.getDay(),K(d));if(p>=S.set.goal)sk++;else if(i>0)break}
const hab=c=>{let a=0,b=0;days.forEach(d=>{dayActs(d.getDay()).filter(x=>x.cat===c).forEach(x=>{a++;if(isDone(x.id,K(d)))b++})});return a?Math.round(100*b/a):0};
const best=days.reduce((b,d,i)=>P[i]>P[b]?i:b,0);
return`<div class="view"><h1>Statistics</h1><div class="card row sp"><div><small>Today</small><h1>${P[6]}%</h1></div>${ring(avg)}<div><small>7-day avg</small><br><small>30-day avg</small><br><b>${m}%</b></div></div>
<div class="card"><b>🔥 Streak: ${sk} day${sk===1?'':'s'}</b><br><small>Days reaching your ${S.set.goal}% goal</small></div>
<div class="card"><b>Weekly report</b><div class="bars" style="margin-top:12px">${days.map((d,i)=>`<div><i style="height:${P[i]}px"></i>${DN[d.getDay()][0]}<br>${P[i]}</div>`).join('')}</div><small>Best day: ${DN[days[best].getDay()]} (${P[best]}%)</small></div>
<div class="card"><b>Habit consistency (7 days)</b>${[['run','🏃 Morning run'],['gym','🏋 Gym'],['study','📚 Study'],['sleep','😴 Sleep routine']].map(([c,n])=>`<div style="margin-top:10px" class="row sp"><small>${n}</small><b>${hab(c)}%</b></div><div class="bar"><i style="width:${hab(c)}%"></i></div>`).join('')}</div>
<div class="card"><b>Milestones</b><p>${sk>=7?'🏆 7-day streak!':'🎯 Reach a 7-day streak'}<br>${avg>=80?'⭐ 80%+ weekly average':'🎯 Hit an 80% weekly average'}<br>${hab('run')>=80?'🥇 Running champion':'🎯 Run 80% of mornings'}</p></div></div>`}
function sett(){const s=S.set,o=(v,t)=>`<option value="${v}" ${s.theme===v?'selected':''}>${t}</option>`;
return`<div class="view"><h1>Settings</h1>
<div class="card"><label>Your name</label><input id="sn" value="${esc(s.name)}">
<label>Theme</label><select id="th">${o('dark','🌙 Dark')}${o('light','☀️ Light')}${o('system','📱 System default')}</select>
<label>Accent colour</label><div class="row">${['#7554F7','#3478F6','#A78BFA','#10B981','#F43F5E','#F59E0B'].map(c=>`<div class="sw" data-a="ac" data-id="${c}" style="background:${c}"></div>`).join('')}</div><br>
<label>Time format</label><select id="tf"><option value="0" ${s.h24?'':'selected'}>12-hour</option><option value="1" ${s.h24?'selected':''}>24-hour</option></select>
<label>First day of week</label><select id="ws">${[0,1,6].map(d=>`<option value="${d}" ${s.ws===d?'selected':''}>${DN[d]}</option>`).join('')}</select>
<label>Text size</label><select id="fs">${[[14,'Small'],[16,'Medium'],[18,'Large']].map(([v,t])=>`<option value="${v}" ${s.fs===v?'selected':''}>${t}</option>`).join('')}</select>
<label>Daily goal (% to count a streak day)</label><input id="gl" type="number" min="10" max="100" value="${s.goal}"></div>
<div class="card"><b>Category colours</b>${Object.keys(CATS).map(c=>`<div class="row sp"><label>${CATS[c][0]}</label><input type="color" data-cc="${c}" value="${col(c)}" style="width:70px"></div>`).join('')}</div>
<div class="card"><b>Copy a day</b><div class="row"><select id="cf">${DN.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select><select id="ct">${DN.map((n,i)=>`<option value="${i}" ${i===6?'selected':''}>${n}</option>`).join('')}</select></div><button class="btn" data-a="cp">Copy schedule</button></div>
<div class="card"><b>Reminders</b><p><small>Alerts 5 min before activities while the app is open (iOS needs it added to Home Screen).</small></p><button class="btn" data-a="nt">Enable notifications</button></div>
<div class="card"><b>Backup</b><div class="row" style="margin-top:8px"><button class="btn" data-a="ex">Export</button><button class="btn g" data-a="im">Import</button><input id="imf" type="file" accept=".json" hidden></div><br><button class="btn r sm" data-a="rst">Reset to original timetable</button></div>
<div class="card"><b>NEVENCHI</b><br><small>PLAN. STUDY. GROW. ACHIEVE.<br>Offline-first · data stays on this device.</small></div></div>`}
const NAV=[['home','Home','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['sched','Schedule','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['tasks','Tasks','<path d="M9 6h12M9 12h12M9 18h12M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>'],['stats','Stats','<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'],['sett','Settings','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>']];
const VIEWS={home,sched,tasks,stats,sett};
function render(keep){theme();const y=scrollY;$('#app').classList.toggle('ent',!keep);$('#app').innerHTML=VIEWS[V]();$('#nav').innerHTML=NAV.map(n=>`<button class="${V===n[0]?'on':''}" data-a="nv" data-id="${n[0]}"><svg viewBox="0 0 24 24">${n[2]}</svg>${n[1]}</button>`).join('');if(keep)scrollTo(0,y);tick();if(!keep)cu()}
function cu(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1100);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function tick(){const n=new Date(),c=$('#clk');if(c)c.textContent=S.set.h24?n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});const d=$('#cd');if(d){const s=d.dataset.t*60-(n.getHours()*3600+n.getMinutes()*60+n.getSeconds());d.textContent=s>0?(s>3600?Math.floor(s/3600)+'h ':'')+Math.floor(s%3600/60)+'m '+String(s%60).padStart(2,'0')+'s':'now'}}
function remind(){if(!S.set.remind)return;const n=new Date(),dt=K(n),m=nowM();dayActs(n.getDay()).forEach(a=>{const k='r'+a.id+dt;if(a.s-m===5&&!remind[k]){remind[k]=1;toast('⏰ '+a.name+' starts in 5 min');if('Notification'in window&&Notification.permission==='granted')try{new Notification('NEVENCHI',{body:a.name+' starts in 5 minutes'})}catch(e){}}})}
function gaps(a){const dt=a.day,m=Math.max(nowM(),330),busy=S.acts.filter(b=>b.day===dt&&b.id!==a.id&&b.cat!=='free'&&b.cat!=='sleep').map(b=>[b.s,b.e]).sort((x,y)=>x[0]-y[0]),out=[],d=dur(a);let c=m;for(const[s,e]of busy.concat([[1320,1320]])){if(s-c>=d&&out.length<3)out.push(c);c=Math.max(c,e)}return out.filter(x=>x+d<=1320)}
function edit(id,day,sug){const a=id?S.acts.find(x=>x.id===id):{name:'',desc:'',day,s:540,e:600,cat:'study',prio:'normal',note:''},sg=sug?gaps(a):[];
$('#mod').innerHTML=`<div class="card"><h2 style="margin-top:0">${id?'Edit activity':'New activity'}</h2><label>Name</label><input id="en" value="${esc(a.name)}"><label>Description</label><input id="ed" value="${esc(a.desc)}">
<label>Day</label><select id="eD">${DN.map((n,i)=>`<option value="${i}" ${a.day===i?'selected':''}>${n}</option>`).join('')}</select>
<div class="row"><div style="flex:1"><label>Start</label><input id="es" type="time" value="${tv(a.s)}"></div><div style="flex:1"><label>End</label><input id="ee" type="time" value="${tv(a.e)}"></div></div>
${sg.length?`<label>Suggested free times</label><div class="chips">${sg.map(x=>`<span class="chip" data-a="pk" data-id="${x}">${fmt(x)} – ${fmt(x+dur(a))}</span>`).join('')}</div><br>`:sug?'<small>No free gap left today — pick another day above.</small><br>':''}
<label>Category</label><select id="ec">${Object.keys(CATS).map(c=>`<option value="${c}" ${a.cat===c?'selected':''}>${CATS[c][0]}</option>`).join('')}</select>
<label>Priority</label><select id="ep">${['low','normal','high'].map(p=>`<option ${a.prio===p?'selected':''}>${p}</option>`).join('')}</select>
<label>Notes</label><textarea id="eN" rows="2">${esc(a.note)}</textarea>
<div class="row"><button class="btn" data-a="sv" data-id="${id||''}" style="flex:1">Save</button><button class="btn g" data-a="cl" style="flex:1">Cancel</button></div>
${id?`<div class="row" style="margin-top:8px"><button class="btn g sm" data-a="du" data-id="${id}">Duplicate</button><button class="btn r sm" data-a="de" data-id="${id}">Delete</button></div>`:''}</div>`;$('#mod').classList.add('on')}
const close=()=>$('#mod').classList.remove('on');
function toggle(id,dt){const d=S.done[dt]=S.done[dt]||{};const was=pct(new Date(dt+'T12:00').getDay(),dt);d[id]?delete d[id]:d[id]=1;LT=id+dt;save();render(1);const now=pct(new Date(dt+'T12:00').getDay(),dt);if(now===100&&was<100){confetti();toast('🎉 Daily goal complete, '+S.set.name+'!')}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
if(a==='nv'){V=id;render();scrollTo(0,0)}else if(a==='tg')toggle(id,t.dataset.d)
else if(a==='sd'){SD=+id;render(1)}else if(a==='fl'){F=id;render(1)}
else if(a==='add')edit(null,SD);else if(a==='ed')edit(id);else if(a==='rs')edit(id,0,1);else if(a==='cl')close();
else if(a==='pk'){$('#es').value=tv(+id);const x=S.acts.find(y=>y.id===$('#mod [data-a=sv]').dataset.id);$('#ee').value=tv((+id+dur(x))%1440);document.querySelectorAll('#mod .chip').forEach(c=>c.classList.toggle('on',c===t))}
else if(a==='sv'){const n=$('#en').value.trim();if(!n)return toast('Please enter a name');const o={name:n,desc:$('#ed').value,day:+$('#eD').value,s:mm($('#es').value||'00:00'),e:mm($('#ee').value||'00:00'),cat:$('#ec').value,prio:$('#ep').value,note:$('#eN').value};
if(id)Object.assign(S.acts.find(x=>x.id===id),o);else S.acts.push({id:'a'+(++S.n),...o});save();close();SD=o.day;render(1);const sv=S.acts.find(x=>x.id===(id||'a'+S.n));toast(over(sv)?'⚠ Saved — overlaps another activity':'Saved ✓')}
else if(a==='du'){const x=S.acts.find(y=>y.id===id);S.acts.push({...x,id:'a'+(++S.n),name:x.name+' (copy)'});save();close();render(1);toast('Duplicated')}
else if(a==='de'){if(confirm('Delete this activity?')){S.acts=S.acts.filter(x=>x.id!==id);save();close();render(1)}}
else if(a==='st'){const dt=K(new Date());(S.started[dt]=S.started[dt]||{})[id]=nowM();save();render(1);toast('Started ▶')}
else if(a==='pp'){pom.run=!pom.run;render(1)}else if(a==='pr'){pom={run:false,t:1500,brk:false};render(1)}
else if(a==='ac'){S.set.accent=id;save();render(1)}
else if(a==='cp'){const f=+$('#cf').value,to=+$('#ct').value;if(f===to)return toast('Pick two different days');if(S.acts.some(x=>x.day===to)&&!confirm('Add to existing '+DN[to]+' schedule?'))return;dayActs(f).forEach(x=>S.acts.push({...x,id:'a'+(++S.n),day:to}));save();toast('Copied '+DN[f]+' → '+DN[to])}
else if(a==='nt'){if('Notification'in window){const r=await Notification.requestPermission();toast(r==='granted'?'Notifications on':'Using in-app reminders')}else toast('Using in-app reminders')}
else if(a==='ex'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='nevenchi-backup-'+K(new Date())+'.json';l.click()}
else if(a==='im')$('#imf').click();
else if(a==='rst'){if(confirm('Reset all activities and progress?')){const th=S.set;S=seed();S.set={...S.set,theme:th.theme,accent:th.accent,name:th.name};save();render()}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;const p=e.target.selectionStart;render(1);const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const i=e.target,s=S.set;
if(i.id==='imf'){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.acts||!d.set)throw 0;S=d;save();render();toast('Backup restored')}catch(x){toast('Invalid backup file')}});return}
if(i.dataset.cc){s.colors[i.dataset.cc]=i.value}else if(i.id==='sn')s.name=i.value.trim()||'Nevenchi';else if(i.id==='th')s.theme=i.value;else if(i.id==='tf')s.h24=i.value==='1';else if(i.id==='ws'){s.ws=+i.value;SD=Math.min(SD,6)}else if(i.id==='fs')s.fs=+i.value;else if(i.id==='gl')s.goal=Math.min(100,Math.max(10,+i.value||70));else return;save();render(1)});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>S&&theme());
setInterval(()=>{if(!S)return;tick();if(pom.run){pom.t--;if(pom.t<=0){pom.brk=!pom.brk;pom.t=pom.brk?300:1500;pom.run=false;toast(pom.brk?'🍅 Focus done — take a break':'Break over — ready to focus');if(navigator.vibrate)navigator.vibrate(200);render(1)}else{const p=$('#pt');if(p)p.textContent=pomT()}}},1000);
setInterval(()=>S&&remind(),20000);
(async()=>{await idb();S=await dget();if(!S||!S.acts){S=seed();save()}S.set.colors=S.set.colors||{};render();setTimeout(()=>$('#sp').classList.add('out'),1300);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
